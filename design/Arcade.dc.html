<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'VT323', 'Courier New', monospace; }
    a { color: #35f0d0; } a:hover { color: #a7ffe9; }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0a0714; color: #e8e3ff; display: flex; flex-direction: column; box-sizing: border-box; padding: 34px 24px 26px 24px; position: relative; overflow: hidden">
  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.35) 0px, rgba(0,0,0,0.35) 2px, transparent 2px, transparent 5px); pointer-events: none"></div>

  <div style="text-align: center">
    <div style="font-family: 'Press Start 2P', monospace; font-size: 22px; line-height: 1.5; color: #ff4dd8; text-shadow: 0 0 14px rgba(255,77,216,0.7)">BØDE-<br>KASSEN</div>
    <div style="font-family: 'Press Start 2P', monospace; font-size: 9px; color: #35f0d0; margin-top: 12px; letter-spacing: 0.1em">HIGH SCORES · RUNDE 14</div>
  </div>

  <div style="margin-top: 26px; border: 3px solid #35f0d0; box-shadow: 0 0 18px rgba(53,240,208,0.35), inset 0 0 12px rgba(53,240,208,0.12); padding: 18px 16px; flex-grow: 1; display: flex; flex-direction: column">
    <div style="display: flex; font-family: 'Press Start 2P', monospace; font-size: 8px; color: #8d85b8; padding-bottom: 12px; border-bottom: 2px dashed #2c2350">
      <div style="width: 50px">RANK</div>
      <div style="flex-grow: 1">SPILLER</div>
      <div style="width: 80px; text-align: right">GÆLD</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 10px; font-size: 24px">
      <div style="display: flex; align-items: center; min-height: 46px; color: #ffe14d; text-shadow: 0 0 10px rgba(255,225,77,0.5)">
        <div style="width: 50px">1ST</div>
        <div style="flex-grow: 1">FREDERIK</div>
        <div style="width: 90px; text-align: right">120 KR</div>
      </div>
      <div style="display: flex; align-items: center; min-height: 46px; color: #c9c4e8">
        <div style="width: 50px">2ND</div>
        <div style="flex-grow: 1">MIKKEL</div>
        <div style="width: 90px; text-align: right">85 KR</div>
      </div>
      <div style="display: flex; align-items: center; min-height: 46px; color: #f0a35f">
        <div style="width: 50px">3RD</div>
        <div style="flex-grow: 1">SOFIE</div>
        <div style="width: 90px; text-align: right">60 KR</div>
      </div>
      <div style="display: flex; align-items: center; min-height: 46px; color: #8d85b8">
        <div style="width: 50px">4TH</div>
        <div style="flex-grow: 1">CAMILLA</div>
        <div style="width: 90px; text-align: right">45 KR</div>
      </div>
      <div style="display: flex; align-items: center; min-height: 46px; color: #8d85b8">
        <div style="width: 50px">5TH</div>
        <div style="flex-grow: 1">ANDERS</div>
        <div style="width: 90px; text-align: right">30 KR</div>
      </div>
      <div style="display: flex; align-items: center; min-height: 46px; color: #8d85b8">
        <div style="width: 50px">6TH</div>
        <div style="flex-grow: 1">LOUISE</div>
        <div style="width: 90px; text-align: right">20 KR</div>
      </div>
      <div style="display: flex; align-items: center; min-height: 46px; color: #35f0d0">
        <div style="width: 50px"></div>
        <div style="flex-grow: 1">JONAS · GAME CLEAR</div>
        <div style="width: 90px; text-align: right">0 KR</div>
      </div>
    </div>
    <div style="margin-top: auto; border-top: 2px dashed #2c2350; padding-top: 12px; display: flex; justify-content: space-between; font-size: 20px; color: #8d85b8">
      <div>POT: 4.320 KR</div>
      <div>SPILLERE: 17</div>
    </div>
  </div>

  <div style="margin-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <div style="font-family: 'Press Start 2P', monospace; font-size: 11px; color: #ffe14d; animation: blink 1.2s step-end infinite; text-shadow: 0 0 10px rgba(255,225,77,0.6)">INSERT COIN TO PAY</div>
    <div style="width: 100%; height: 56px; background: #ff4dd8; color: #0a0714; display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', monospace; font-size: 12px; box-shadow: 0 6px 0 #8f2478">START NYT MØDE</div>
  </div>
</div>
</x-dc>
</body>
</html>
